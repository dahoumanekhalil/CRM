services:
  postgres:
    image: postgres:16-alpine
    container_name: webscale_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: webscale
      POSTGRES_PASSWORD: webscale_dev_password
      POSTGRES_DB: webscale
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webscale -d webscale"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

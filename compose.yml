services:
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: webscale_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: webscale
      POSTGRES_PASSWORD: webscale_dev_password
      POSTGRES_DB: webscale
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webscale -d webscale"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    container_name: webscale_livekit
    # --node-ip tells LiveKit which IP to advertise in ICE candidates.
    # Without it the container's internal Docker IP (172.x.x.x) is used,
    # which the browser cannot reach → "could not establish pc connection".
    # 127.0.0.1 works when host and guest are on the same machine.
    # For a different device on the same Wi-Fi, change to your LAN IP.
    command: --config /etc/livekit/livekit.yml --node-ip 192.168.1.11 --dev
    volumes:
      - ./livekit.yml:/etc/livekit/livekit.yml:ro
    ports:
      - "7880:7880"       # WebSocket API + HTTP
      - "7881:7881"       # RTC over TCP (fallback)
      - "7882:7882/udp"   # RTC over UDP (primary media)
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: webscale_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: webscale_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console → http://localhost:9001
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: webscale_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 4 &&
        mc alias set local http://minio:9000 minio minio123 &&
        mc mb --ignore-existing local/recordings &&
        echo 'MinIO bucket ready.'
      "
    restart: "no"

  livekit-egress:
    image: livekit/egress:latest
    container_name: webscale_egress
    environment:
      EGRESS_CONFIG_FILE: /etc/egress/egress.yml
    volumes:
      - ./egress.yml:/etc/egress/egress.yml:ro
    cap_add:
      - SYS_ADMIN
    depends_on:
      - livekit
      - redis
      - minio
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

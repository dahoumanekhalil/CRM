# LiveKit development config for Docker on Windows/Mac.
# node_ip is passed as a CLI flag (--node-ip) since it is a top-level server
# option, not an rtc sub-option.  This file only sets keys and rtc ports.

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 7882
  port_range_end: 7882
  use_external_ip: false

keys:
  devkey: secret

logging:
  level: info
  pion_level: info

# Webhook — fires participant_joined/left and room_finished events.
# host.docker.internal resolves to the Windows host from inside Docker Desktop.
# For production, set this to your public HTTPS URL.
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:3000/api/livekit/webhook
